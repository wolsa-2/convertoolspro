<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#20242B" />
    
    <!-- The app font is loaded directly from the font file declared in index.css. -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <meta name="robots" content="index, follow" />

    <link rel="canonical" href="https://photosize.vercel.app/" />
    <link rel="alternate" hreflang="x-default" href="https://photosize.vercel.app/" />
    
    <!-- Fix Issue 5: Complete Favicon Set -->
    <link rel="icon" type="image/svg+xml" href="/favicon-v2.svg">
    <link rel="manifest" href="/site.webmanifest?v=2">
    
    <meta name="author" content="PhotoSize Team" />
    <meta name="google-adsense-account" content="ca-pub-1527585635151141">
    <meta name="google-site-verification" content="Up1CF98SN6BzjoBNvo7et1_iN5aQpbbod875brzrsXg" />
    
    <!-- AdSense is loaded on demand by AdUnit only when a valid slot is configured. -->

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://photosize.vercel.app/" />

    <meta property="twitter:url" content="https://photosize.vercel.app/" />
    <meta property="twitter:title" content="PhotoSize | Free Online Photo, Image & Utility Tools" />
