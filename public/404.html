<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#4F46E5">
  <title>Page Not Found | PhotoSize</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f7f8fd;color:#171a35;font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif}
    main{max-width:560px;text-align:center;background:#fff;border:1px solid #e8eaf4;border-radius:28px;padding:48px 32px;box-shadow:0 18px 60px rgba(23,26,53,.08)}
    .code{font-size:clamp(72px,18vw,120px);font-weight:900;line-height:1;color:#5658e8;letter-spacing:-.08em}
    h1{font-size:28px;margin:20px 0 10px}p{color:#68708a;line-height:1.7;margin:0 0 28px}
    a{display:inline-block;padding:13px 22px;border-radius:13px;background:#5658e8;color:white;text-decoration:none;font-weight:700}
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>The page may have moved, or the address may be incorrect. Return to PhotoSize to find the tools you need.</p>
    <a href="/">Go to PhotoSize Home</a>
  </main>
</body>
</html>
