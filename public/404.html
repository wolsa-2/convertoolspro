<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#0066CC">
  <title>Page Not Found | PhotoSize</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#fff;color:#1d1d1f;font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif}
    main{width:min(100%,560px);text-align:center;background:#fff;border:1px solid #e5e7eb;border-radius:24px;padding:48px 32px}
    .code{font-size:clamp(72px,18vw,120px);font-weight:750;line-height:1;color:#0066cc;letter-spacing:-.08em}
    h1{font-size:28px;letter-spacing:-.04em;margin:20px 0 10px}
    p{color:#6e6e73;line-height:1.7;margin:0 0 28px}
    a{display:inline-block;padding:13px 22px;border-radius:999px;background:#0066cc;color:white;text-decoration:none;font-weight:650}
    a:focus-visible{outline:3px solid rgb(0 102 204 / 30%);outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>The page may have moved, or the address may be incorrect. Return to PhotoSize to find the tools you need.</p>
    <a href="/">Go to PhotoSize Home</a>
  </main>
</body>
</html>
