name: Quality Checks

on:
  push:
    branches:
      - main
      - feature/**
      - fix/**
      - redesign/**
      - performance/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: TypeScript and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency security audit
        shell: bash
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node -e 'const r=require(process.env.RUNNER_TEMP+"/npm-audit.json"); const summary=r.metadata?.vulnerabilities; if (!summary) { console.error("npm audit did not return a valid vulnerability summary"); process.exit(1); } console.log("Audit summary:", JSON.stringify(summary)); for (const [name,v] of Object.entries(r.vulnerabilities || {})) { console.log(JSON.stringify({package:name,severity:v.severity,isDirect:v.isDirect,range:v.range,fixAvailable:v.fixAvailable,via:(v.via || []).map(x => typeof x === "string" ? x : {title:x.title,url:x.url,range:x.range})})); } if (summary.total > 0) process.exit(1);'

      - name: Type check
        run: npm run lint

      - name: Build for production
        run: npm run build
        env:
          VITE_DISABLE_ADS: "true"

      - name: Lighthouse mobile audit (built preview)
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./.lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
