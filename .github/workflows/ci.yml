name: Build and TypeScript validation

on:
  push:
    branches:
      - professional-ui-redesign
  pull_request:
    branches:
      - security-fixes

permissions:
  contents: read

jobs:
  validate:
    name: TypeScript and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run lint
      - name: Production build
        run: npm run build
