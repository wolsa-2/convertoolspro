name: One-time dependency remediation

on:
  push:
    branches:
      - feature/browser-tools-expansion

permissions:
  contents: write

concurrency:
  group: dependency-remediation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install current lockfile
        run: npm ci

      - name: Apply non-breaking security updates
        shell: bash
        run: |
          npm audit fix || true
          npm audit fix || true
          npm ls esbuild qs || true

      - name: Verify dependency audit
        shell: bash
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node -e 'const r=require(process.env.RUNNER_TEMP+"/npm-audit.json"); const v=r.metadata?.vulnerabilities; if (!v) { console.error("Could not read npm audit results"); process.exit(1); } console.log("Post-fix audit:", JSON.stringify(v)); if (v.total > 0) process.exit(1);'

      - name: Type check
        run: npm run lint

      - name: Production build
        run: npm run build
        env:
          VITE_DISABLE_ADS: "true"

      - name: Commit compatible lockfile updates
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency file changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "security: apply compatible npm dependency updates"
          git push origin "HEAD:${GITHUB_REF_NAME}"
